name: Tests

env:
  ARD_VERSION: v0.38.0
  ARD_REF: c1d2d30c6eccf7b9f26aada0d384af728f050d13

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migr
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Cache Ard compiler
        id: cache-ard
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/ard
          key: ard-compiler-${{ runner.os }}-${{ env.ARD_VERSION }}-${{ env.ARD_REF }}

      - name: Build Ard compiler
        if: steps.cache-ard.outputs.cache-hit != 'true'
        run: |
          git init /tmp/ard
          git -C /tmp/ard remote add origin https://github.com/akonwi/ard.git
          git -C /tmp/ard fetch --depth 1 origin "$ARD_REF"
          git -C /tmp/ard checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ard rev-parse HEAD)" = "$ARD_REF"
          cd /tmp/ard/compiler
          CGO_ENABLED=1 go build \
            --tags=goexperiment.jsonv2 \
            -ldflags="-X github.com/akonwi/ard/version.Version=$ARD_VERSION" \
            -o /tmp/ard-bin \
            .
          sudo install /tmp/ard-bin /usr/local/bin/ard

      - name: Verify Ard compiler
        run: test "$(ard version)" = "$ARD_VERSION"

      - name: Download Go dependencies
        run: go mod download

      - name: Fetch Ard dependencies
        run: ard deps fetch

      - name: Build migr
        run: ard build main.ard --out /tmp/migr

      - name: Run Ard tests
        run: ard test
